appId: de.rechly.desktop
productName: Rechly Desktop
copyright: © Rechly — AGPL-3.0

directories:
  output: dist
  buildResources: build

# better-sqlite3 >= 13 is an N-API addon that ships prebuilt binaries for
# darwin/win32 x64+arm64 and loads them first, so packaging doesn't need to
# recompile it (and node-gyp can't cross-compile, e.g. Windows from macOS).
npmRebuild: false
files:
  - out/**/*.js
  - ui/**/*
  - package.json
  # Ship only the SQLite binary for the target platform/arch, not the C sources
  # or prebuilds for other platforms (~26 MB). Exclusions only: platform-level
  # `files` can't re-include something excluded here. ${arch} is the target arch.
  - "!node_modules/better-sqlite3/{deps,src,build}{,/**/*}"
  - "!node_modules/better-sqlite3/binding.gyp"
  - "!node_modules/better-sqlite3/prebuilds/linux*.node"
  - "!node_modules/better-sqlite3/prebuilds/!(*-${arch}).node"

mac:
  sign: scripts/sign-macos.cjs
  # electron-builder 26 only calls the custom signer when an identity resolves.
  # "-" opts in to ad-hoc signing for local and CI builds. For Developer ID
  # distribution, override it: -c.mac.identity="Your Name (TEAMID)".
  identity: "-"
  files:
    - "!node_modules/better-sqlite3/prebuilds/win32-*.node"
  category: public.app-category.finance
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false

# Stable, version-less names so that
# https://github.com/myaxyo/rechly_desktop/releases/latest/download/<name>
# always points to the newest release (used by rechly.de download links).
dmg:
  artifactName: Rechly-Desktop-mac-${arch}.${ext}

win:
  files:
    - "!node_modules/better-sqlite3/prebuilds/darwin-*.node"
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  artifactName: Rechly-Desktop-Setup-win-${arch}.${ext}
