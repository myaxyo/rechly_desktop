appId: de.rechly.desktop
productName: Rechly Desktop
copyright: © Rechly — AGPL-3.0

directories:
  output: dist
  buildResources: build

files:
  - main.js
  - preload.js
  - store.js
  - eRechnung.js
  - ai.js
  - ui/**/*
  - package.json

mac:
  category: public.app-category.finance
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
