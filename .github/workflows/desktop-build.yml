name: Desktop validation and installers
on:
  push:
    branches: [main, 'release/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            target: win
            arch: x64
          - label: macOS Intel
            os: macos-15-intel
            target: mac
            arch: x64
          - label: macOS Apple Silicon
            os: macos-15
            target: mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      TZ: Europe/Berlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install isolated UI test tooling
        run: npm install --prefix .ci-tools --no-save --package-lock=false playwright-core@1.57.0
      - name: Typecheck, compile and regression tests
        run: npm run typecheck && npm run build && node --test tests/*.test.cjs
      - name: Desktop workflows
        run: |
          export RECHLY_PLAYWRIGHT_PATH="$GITHUB_WORKSPACE/.ci-tools/node_modules/playwright-core"
          node scripts/run-desktop-tests.cjs tests/business.electron.cjs tests/calendar.electron.cjs tests/core.electron.cjs
      - name: Build native installer
        run: npx electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never
      - name: Verify packaged application
        run: |
          export RECHLY_PLAYWRIGHT_PATH="$GITHUB_WORKSPACE/.ci-tools/node_modules/playwright-core"
          export RECHLY_EXECUTABLE="$(node scripts/packaged-executable.cjs)"
          node scripts/run-desktop-tests.cjs tests/calendar.electron.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: rechly-${{ matrix.target }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/*-mac.yml
            dist/latest.yml
