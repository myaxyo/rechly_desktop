name: Desktop validation and installers
on:
  push:
    branches: [main, 'release/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            target: win
            arch: x64
          - label: macOS Intel
            os: macos-15-intel
            target: mac
            arch: x64
          - label: macOS Apple Silicon
            os: macos-15
            target: mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      TZ: Europe/Berlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install isolated UI test tooling
        run: npm install --prefix .ci-tools --no-save --package-lock=false playwright-core@1.57.0
      - name: Typecheck, compile and regression tests
        run: npm run typecheck && npm test
      - name: Desktop workflows
        run: |
          export RECHLY_PLAYWRIGHT_PATH="$GITHUB_WORKSPACE/.ci-tools/node_modules/playwright-core"
          node scripts/run-desktop-tests.cjs tests/business.electron.cjs tests/calendar.electron.cjs tests/core.electron.cjs tests/worklog.electron.cjs tests/storage.electron.cjs
      - name: Build native installer
        run: npx electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never
      - name: Verify Mac bundle signature
        if: runner.os == 'macOS'
        run: node scripts/verify-macos.cjs
      - name: Verify packaged application
        run: |
          export RECHLY_PLAYWRIGHT_PATH="$GITHUB_WORKSPACE/.ci-tools/node_modules/playwright-core"
          export RECHLY_EXECUTABLE="$(node scripts/packaged-executable.cjs)"
          node scripts/run-desktop-tests.cjs tests/calendar.electron.cjs tests/worklog.electron.cjs tests/storage.electron.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: rechly-${{ matrix.target }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/*-mac.yml
            dist/latest.yml

  release:
    name: Publish verified installers
    needs: desktop
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: rechly-*
          path: release-artifacts
      - name: Prepare release files and checksums
        shell: bash
        run: |
          mkdir release-files
          find release-artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \) -exec cp {} release-files/ \;
          test "$(find release-files -name '*.exe' | wc -l)" -eq 1
          test "$(find release-files -name '*.dmg' | wc -l)" -eq 2
          cd release-files
          # GitHub normalizes spaces in uploaded asset names to dots.
          for file in *; do
            normalized="${file// /.}"
            if [ "$file" != "$normalized" ]; then mv -- "$file" "$normalized"; fi
          done
          sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to replace published assets."
            exit 0
          fi
          gh release create "$tag" release-files/* --target "$GITHUB_SHA" --title "Rechly Desktop $version" --notes-file "docs/RELEASE-$version.md" --draft
          gh release edit "$tag" --draft=false --latest
